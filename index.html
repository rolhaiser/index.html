<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mi página personal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e1e; /* color de fondo general */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background-color: #ffffff; /* recuadro blanco */
      border: 3px solid #556B2F; /* borde con tu color */
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    h1 {
      color: #2c3e50;
    }
    p {
      font-size: 18px;
      color: #555;
    }
    a {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 25px;
      background-color: rgb(85,107,47); /* tu color exacto */
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
    a:hover {
      background-color: #6b8e23; /* tono más claro al pasar el mouse */
    }
    img {
      border-radius: 10px;
      margin-bottom: 20px;
    }
    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="imagenes/autor.png" alt="Foto de Ivo" width="300">
    <h1>Hola, soy Ivo</h1>
    <p>Bienvenido a mi página.</p>
    <a href="documentos/comandospython.pdf" target="_blank">Descargar hoja de comandos de Python</a>
    <footer>
      <p>© 2026 Ivo Rolhaiser</p>
    </footer>
  </div>
</body>
</html>
